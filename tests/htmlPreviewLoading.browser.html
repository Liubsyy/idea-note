<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML 按需加载与慢资源测试</title></head>
<body>
  <div style="padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button id="slow-example">打开慢加载例子</button>

    <button id="run-tests">运行自动测试</button>

  <div id="test-editor" style="height:560px;border:1px solid var(--border)"></div>

name: File preview tests
on:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'tests/**', 'package*.json', '.github/workflows/file-preview-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run test:file-preview
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked html_preview --lib
